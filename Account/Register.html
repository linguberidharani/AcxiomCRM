<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - AcxiomCRM</title>
    <link rel="stylesheet" href="../lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/site.css">
</head>
<body data-module="Account" data-public="true">

    <div class="auth-page">
        <div class="auth-side">
            <div class="brand"><span class="brand-mark"></span>AcxiomCRM</div>
            <h1>Create your account.</h1>
            <p>New accounts are created as Sales Executive. An administrator can assign your manager or change your role afterwards.</p>
            <div class="foot">Version 1.0</div>
        </div>

        <div class="auth-form wide">
            <div class="inner">
                <h2>Register</h2>
                <p class="lead-in">All fields are required.</p>

                <form id="registerForm" method="post" novalidate>
                    <div class="form-alert d-none" role="alert"></div>

                    <div class="row gx-3 gy-2">
                        <div class="col-sm-6">
                            <label class="form-label" for="FullName">Full Name</label>
                            <input class="form-control" type="text" id="FullName" name="FullName" autocomplete="name"
                                   data-val="true" data-val-required="Full Name is required."
                                   data-val-length="Full Name cannot be longer than 100 characters." data-val-length-max="100">
                            <span class="field-validation-valid" data-valmsg-for="FullName" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="UserName">Username</label>
                            <input class="form-control" type="text" id="UserName" name="UserName" autocomplete="username"
                                   data-val="true" data-val-required="Username is required."
                                   data-val-username="Username must be 4 to 30 characters: letters, numbers, dot or underscore.">
                            <span class="field-validation-valid" data-valmsg-for="UserName" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="Email">Email</label>
                            <input class="form-control" type="email" id="Email" name="Email" autocomplete="email" placeholder="user@example.com"
                                   data-val="true" data-val-required="Email is required." data-val-email="Enter a valid email address."
                                   data-val-length="Email cannot be longer than 150 characters." data-val-length-max="150">
                            <span class="field-validation-valid" data-valmsg-for="Email" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="Phone">Phone</label>
                            <input class="form-control" type="tel" id="Phone" name="Phone" autocomplete="tel" inputmode="numeric" placeholder="10 digit mobile number"
                                   data-val="true" data-val-required="Phone is required." data-val-phone="Enter a valid phone number.">
                            <span class="field-validation-valid" data-valmsg-for="Phone" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="Password">Password</label>
                            <input class="form-control" type="password" id="Password" name="Password" autocomplete="new-password"
                                   data-val="true" data-val-required="Password is required."
                                   data-val-passwordpolicy="Password does not meet the password policy.">
                            <span class="field-validation-valid" data-valmsg-for="Password" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="ConfirmPassword">Confirm Password</label>
                            <input class="form-control" type="password" id="ConfirmPassword" name="ConfirmPassword" autocomplete="new-password"
                                   data-val="true" data-val-required="Confirm Password is required."
                                   data-val-equalto="Password and confirmation do not match." data-val-equalto-other="*.Password">
                            <span class="field-validation-valid" data-valmsg-for="ConfirmPassword" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-12">
                            <ul class="password-rules" id="passwordRules"></ul>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 mt-4" type="submit">Create account</button>
                </form>

                <p class="mt-3 mb-0">Already registered? <a href="Login.html">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="../lib/jquery/dist/jquery.min.js"></script>
    <script src="../lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../lib/jquery-validation/dist/jquery.validate.min.js"></script>
    <script src="../lib/jquery-validation-unobtrusive/dist/jquery.validate.unobtrusive.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/site.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/audit.js"></script>
    <script src="../js/services/common.js"></script>
    <script src="../js/services/customers.js"></script>
    <script src="../js/services/leads.js"></script>
    <script src="../js/services/opportunities.js"></script>
    <script src="../js/services/followups.js"></script>
    <script src="../js/services/activities.js"></script>
    <script src="../js/services/users.js"></script>
    <script src="../js/services/reports.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/account.js"></script>
</body>
</html>

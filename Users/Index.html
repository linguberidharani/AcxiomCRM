<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users - AcxiomCRM</title>
    <link rel="stylesheet" href="../lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/site.css">
</head>
<body class="app" data-module="Users">

    <main id="content">
        <div class="page-head">
            <div>
                <h1>Users</h1>
                <p class="sub" id="scopeText"></p>
            </div>
            <div class="actions">
                <a class="btn btn-primary d-none" id="newLink" href="Create.html"><i class="bi bi-person-plus me-1"></i>New user</a>
            </div>
        </div>

        <div class="panel">
            <form class="filters" id="filterForm">
                <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label" for="q">Search</label>
                        <input type="search" class="form-control form-control-sm" id="q" placeholder="Name, username, email or phone">
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label" for="role">Role</label>
                        <select class="form-select form-select-sm" id="role"></select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label" for="status">Account status</label>
                        <select class="form-select form-select-sm" id="status">
                            <option value="">All</option>
                            <option>Active</option>
                            <option>Inactive</option>
                            <option>Locked</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="reset" class="btn btn-light border btn-sm">Clear</button>
                    </div>
                </div>
            </form>
            <div id="userGrid"></div>
        </div>
    </main>

    <!-- reset password -->
    <div class="modal fade" id="resetModal" tabindex="-1" aria-labelledby="resetTitle" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="resetForm" method="post" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="resetTitle">Reset password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="form-alert d-none" role="alert"></div>
                    <p id="resetText"></p>
                    <div class="mb-2">
                        <label class="form-label required" for="Password">New Password</label>
                        <input class="form-control" type="password" id="Password" name="Password" autocomplete="new-password"
                               data-val="true" data-val-required="New Password is required."
                               data-val-passwordpolicy="Password does not meet the password policy.">
                        <span class="field-validation-valid" data-valmsg-for="Password" data-valmsg-replace="true"></span>
                        <ul class="password-rules" id="passwordRules"></ul>
                    </div>
                    <div>
                        <label class="form-label required" for="ConfirmPassword">Confirm New Password</label>
                        <input class="form-control" type="password" id="ConfirmPassword" name="ConfirmPassword" autocomplete="new-password"
                               data-val="true" data-val-required="Confirm New Password is required."
                               data-val-equalto="Password and confirmation do not match." data-val-equalto-other="*.Password">
                        <span class="field-validation-valid" data-valmsg-for="ConfirmPassword" data-valmsg-replace="true"></span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Reset password</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../lib/jquery/dist/jquery.min.js"></script>
    <script src="../lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../lib/jquery-validation/dist/jquery.validate.min.js"></script>
    <script src="../lib/jquery-validation-unobtrusive/dist/jquery.validate.unobtrusive.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/site.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/audit.js"></script>
    <script src="../js/services/common.js"></script>
    <script src="../js/services/customers.js"></script>
    <script src="../js/services/leads.js"></script>
    <script src="../js/services/opportunities.js"></script>
    <script src="../js/services/followups.js"></script>
    <script src="../js/services/activities.js"></script>
    <script src="../js/services/users.js"></script>
    <script src="../js/services/reports.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/users.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New opportunity - AcxiomCRM</title>
    <link rel="stylesheet" href="../lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/site.css">
</head>
<body class="app" data-module="Opportunities">

    <main id="content">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="Index.html">Opportunities</a></li>
                <li class="breadcrumb-item active" aria-current="page">New opportunity</li>
            </ol>
        </nav>
        <div class="page-head">
            <div>
                <h1 id="pageTitle">New opportunity</h1>
                <p class="sub">Fields marked <span class="text-danger">*</span> are required.</p>
            </div>
        </div>

        <form id="oppForm" method="post" data-mode="create" novalidate>
            <div class="form-alert d-none" role="alert"></div>

            <div class="panel">
                <div class="panel-head"><h2>Opportunity</h2></div>
                <div class="panel-body">
                    <div class="row gx-3 gy-2">
                        <div class="col-md-6">
                            <label class="form-label required" for="OpportunityName">Opportunity Name</label>
                            <input class="form-control" type="text" id="OpportunityName" name="OpportunityName"
                                   data-val="true" data-val-required="Opportunity Name is required."
                                   data-val-length="Opportunity Name cannot be longer than 150 characters." data-val-length-max="150">
                            <span class="field-validation-valid" data-valmsg-for="OpportunityName" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="CustomerId">Customer</label>
                            <select class="form-select" id="CustomerId" name="CustomerId" data-val="true" data-val-required="Customer is required."></select>
                            <span class="field-validation-valid" data-valmsg-for="CustomerId" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required" for="Stage">Stage</label>
                            <select class="form-select" id="Stage" name="Stage" data-val="true" data-val-required="Stage is required."></select>
                            <span class="field-validation-valid" data-valmsg-for="Stage" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required" for="Amount">Amount (&#8377;)</label>
                            <input class="form-control" type="number" id="Amount" name="Amount" inputmode="decimal"
                                   data-val="true" data-val-required="Opportunity Amount is required." data-val-number="Opportunity Amount must be a number."
                                   data-val-positive="Opportunity Amount must be greater than 0.">
                            <span class="field-validation-valid" data-valmsg-for="Amount" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required" for="Probability">Probability (%)</label>
                            <input class="form-control" type="number" id="Probability" name="Probability" inputmode="numeric"
                                   data-val="true" data-val-required="Probability is required." data-val-number="Probability must be a number."
                                   data-val-range="Probability must be between 0 and 100." data-val-range-min="0" data-val-range-max="100">
                            <span class="field-validation-valid" data-valmsg-for="Probability" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required" for="ExpectedCloseDate">Expected Close Date</label>
                            <input class="form-control" type="date" id="ExpectedCloseDate" name="ExpectedCloseDate"
                                   data-val="true" data-val-required="Expected Close Date is required."
                                   data-val-closedate="Expected Close Date cannot be in the past." data-val-closedate-stage="#Stage">
                            <span class="field-validation-valid" data-valmsg-for="ExpectedCloseDate" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="Source">Source</label>
                            <select class="form-select" id="Source" name="Source"></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required" for="AssignedTo">Assigned To</label>
                            <select class="form-select" id="AssignedTo" name="AssignedTo" data-val="true" data-val-required="Assigned To is required."></select>
                            <span class="field-validation-valid" data-valmsg-for="AssignedTo" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-12">
                            <div class="text-muted">Weighted amount (Amount &times; Probability / 100): <strong class="text-body num" id="weighted">-</strong></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="Notes">Notes</label>
                            <textarea class="form-control" id="Notes" name="Notes" rows="3"
                                      data-val="true" data-val-length="Notes cannot be longer than 1000 characters." data-val-length-max="1000"></textarea>
                            <span class="field-validation-valid" data-valmsg-for="Notes" data-valmsg-replace="true"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-3 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Save opportunity</button>
                <a class="btn btn-light border" href="Index.html" id="cancelLink">Cancel</a>
            </div>
        </form>
    </main>

    <script src="../lib/jquery/dist/jquery.min.js"></script>
    <script src="../lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../lib/jquery-validation/dist/jquery.validate.min.js"></script>
    <script src="../lib/jquery-validation-unobtrusive/dist/jquery.validate.unobtrusive.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/site.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/audit.js"></script>
    <script src="../js/services/common.js"></script>
    <script src="../js/services/customers.js"></script>
    <script src="../js/services/leads.js"></script>
    <script src="../js/services/opportunities.js"></script>
    <script src="../js/services/followups.js"></script>
    <script src="../js/services/activities.js"></script>
    <script src="../js/services/users.js"></script>
    <script src="../js/services/reports.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/opportunities.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New lead - AcxiomCRM</title>
    <link rel="stylesheet" href="../lib/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../lib/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/site.css">
</head>
<body class="app" data-module="Leads">

    <main id="content">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="Index.html">Leads</a></li>
                <li class="breadcrumb-item active" aria-current="page">New lead</li>
            </ol>
        </nav>
        <div class="page-head">
            <div>
                <h1 id="pageTitle">New lead</h1>
                <p class="sub">Fields marked <span class="text-danger">*</span> are required.</p>
            </div>
        </div>

        <form id="leadForm" method="post" data-mode="create" novalidate>
            <div class="form-alert d-none" role="alert"></div>

            <div class="panel">
                <div class="panel-head"><h2>Contact</h2></div>
                <div class="panel-body">
                    <div class="row gx-3 gy-2">
                        <div class="col-md-6">
                            <label class="form-label required" for="LeadName">Lead Name</label>
                            <input class="form-control" type="text" id="LeadName" name="LeadName"
                                   data-val="true" data-val-required="Lead Name is required."
                                   data-val-length="Lead Name cannot be longer than 100 characters." data-val-length-max="100">
                            <span class="field-validation-valid" data-valmsg-for="LeadName" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="CompanyName">Company Name</label>
                            <input class="form-control" type="text" id="CompanyName" name="CompanyName"
                                   data-val="true" data-val-length="Company Name cannot be longer than 150 characters." data-val-length-max="150">
                            <span class="field-validation-valid" data-valmsg-for="CompanyName" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="Email">Email</label>
                            <input class="form-control" type="email" id="Email" name="Email" placeholder="user@example.com"
                                   data-val="true" data-val-required="Email is required." data-val-email="Enter a valid email address."
                                   data-val-length="Email cannot be longer than 150 characters." data-val-length-max="150">
                            <span class="field-validation-valid" data-valmsg-for="Email" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required" for="Phone">Phone</label>
                            <input class="form-control" type="tel" id="Phone" name="Phone" inputmode="numeric" placeholder="10 digit mobile number"
                                   data-val="true" data-val-required="Phone is required." data-val-phone="Enter a valid phone number.">
                            <span class="field-validation-valid" data-valmsg-for="Phone" data-valmsg-replace="true"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-head"><h2>Lead details</h2></div>
                <div class="panel-body">
                    <div class="row gx-3 gy-2">
                        <div class="col-md-4">
                            <label class="form-label required" for="Source">Lead Source</label>
                            <select class="form-select" id="Source" name="Source" data-val="true" data-val-required="Lead Source is required."></select>
                            <span class="field-validation-valid" data-valmsg-for="Source" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required" for="Priority">Priority</label>
                            <select class="form-select" id="Priority" name="Priority" data-val="true" data-val-required="Priority is required."></select>
                            <span class="field-validation-valid" data-valmsg-for="Priority" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="ExpectedValue">Expected Value (&#8377;)</label>
                            <input class="form-control" type="number" id="ExpectedValue" name="ExpectedValue" inputmode="decimal"
                                   data-val="true" data-val-number="Expected Value must be a number."
                                   data-val-range="Expected Value must be between 0 and 10,00,00,000." data-val-range-min="0" data-val-range-max="100000000">
                            <span class="field-validation-valid" data-valmsg-for="ExpectedValue" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required" for="Status">Lead Status</label>
                            <select class="form-select" id="Status" name="Status" data-val="true" data-val-required="Lead Status is required."></select>
                            <span class="field-validation-valid" data-valmsg-for="Status" data-valmsg-replace="true"></span>
                            <div class="form-text" id="statusHelp"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label required" for="AssignedTo">Assigned To</label>
                            <select class="form-select" id="AssignedTo" name="AssignedTo" data-val="true" data-val-required="Assigned To is required."></select>
                            <span class="field-validation-valid" data-valmsg-for="AssignedTo" data-valmsg-replace="true"></span>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="Notes">Notes</label>
                            <textarea class="form-control" id="Notes" name="Notes" rows="3"
                                      data-val="true" data-val-length="Notes cannot be longer than 1000 characters." data-val-length-max="1000"></textarea>
                            <span class="field-validation-valid" data-valmsg-for="Notes" data-valmsg-replace="true"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-3 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Save lead</button>
                <a class="btn btn-light border" href="Index.html" id="cancelLink">Cancel</a>
            </div>
        </form>
    </main>

    <script src="../lib/jquery/dist/jquery.min.js"></script>
    <script src="../lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../lib/jquery-validation/dist/jquery.validate.min.js"></script>
    <script src="../lib/jquery-validation-unobtrusive/dist/jquery.validate.unobtrusive.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/site.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/audit.js"></script>
    <script src="../js/services/common.js"></script>
    <script src="../js/services/customers.js"></script>
    <script src="../js/services/leads.js"></script>
    <script src="../js/services/opportunities.js"></script>
    <script src="../js/services/followups.js"></script>
    <script src="../js/services/activities.js"></script>
    <script src="../js/services/users.js"></script>
    <script src="../js/services/reports.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/leads.js"></script>
</body>
</html>
